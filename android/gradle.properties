org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# arm64 only: the device target is aarch64 and the llama.cpp build is arm64.
android.defaults.buildfeatures.buildconfig=false

# The Kotlin compile daemon is a separate JVM and does not inherit
# org.gradle.jvmargs. On a JDK 21 it selects Parallel GC, which in this
# environment makes it print "Kotlin compile daemon is ready" and then exit 0
# before Gradle can connect — four failed retries, then Gradle falls back to
# compiling in-process, which is what turned a two-minute build into a
# quarter of an hour. Disabling Parallel GC keeps the daemon alive.
kotlin.daemon.jvmargs=-Xmx2048m -XX:-UseParallelGC
